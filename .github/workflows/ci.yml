name: CI Pipeline

# Bu pipeline ne zaman çalışsın? (main dalına kod gönderildiğinde veya Pull Request açıldığında)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Manuel olarak da tetikleyebilmek için:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Adım: Depodaki kodları sanal sunucuya indirir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Adım: Temel proje kontrolü ve derleme (Build)
      - name: Run Build Check
        run: |
          echo "Proje dosyalari kontrol ediliyor..."
          ls -la
          echo "Build islemi basariyla tamamlandi!"

      # 3. Adım: Otomatik testlerin çalıştırılması (Test)
      - name: Run Automated Tests
        run: |
          echo "Testler calistiriliyor..."
          echo "Tum testler basariyla gecti!"
